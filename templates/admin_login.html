<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f5f5;
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .login-card {
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 14px;
    padding: 40px 36px;
    width: 100%;
    max-width: 380px;
  }

  .login-title {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .login-sub {
    font-size: 13px;
    color: #888;
    margin-bottom: 28px;
  }

  .error-msg {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #fff0f0;
    border: 1px solid #f5c6c6;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    color: #b22222;
    margin-bottom: 20px;
  }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }

  label { font-size: 13px; font-weight: 500; color: #555; }

  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 15px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #fafafa;
    outline: none;
    transition: border-color 0.15s;
    font-family: inherit;
  }
  input:focus { border-color: #999; background: #fff; }

  .btn-submit {
    width: 100%;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: #1a1a1a;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.15s;
  }
  .btn-submit:hover { background: #333; }
</style>

<div class="login-card">

  <div class="login-title">菁燕窩管理系統</div>
  <div class="login-sub">請登入以繼續</div>

  {% with messages = get_flashed_messages() %}
  {% if messages %}
  <div class="error-msg">
    <i class="fa-solid fa-circle-exclamation"></i>
    {{ messages[0] }}
  </div>
  {% endif %}
  {% endwith %}

  <form method="POST">

    <div class="field">
      <label>帳號</label>
      <input type="text" name="username" placeholder="請輸入帳號">
    </div>

    <div class="field">
      <label>密碼</label>
      <input type="password" name="password" placeholder="請輸入密碼">
    </div>

    <button type="submit" class="btn-submit">登入</button>

  </form>

</div>
