<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f5f5;
    color: #1a1a1a;
  }

  .page-wrap {
    max-width: 760px;
    margin: 40px auto;
    padding: 0 20px 60px;
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
  }

  h1 { font-size: 22px; font-weight: 600; }

  .top-actions { display: flex; gap: 12px; align-items: center; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 500;
    border-radius: 8px;
    text-decoration: none;
    transition: background 0.15s;
  }

  .btn-primary {
    background: #1a1a1a;
    color: #fff;
    border: none;
  }
  .btn-primary:hover { background: #333; }

  .btn-ghost {
    background: transparent;
    color: #555;
    border: 1px solid #ddd;
  }
  .btn-ghost:hover { background: #eee; color: #1a1a1a; }

  .product-list { display: flex; flex-direction: column; gap: 14px; }

  .product-card {
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .product-card img {
    width: 100px;
    height: 100px;
    object-fit: cover;
    border-radius: 8px;
    flex-shrink: 0;
  }

  .product-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }

  .product-name { font-size: 16px; font-weight: 600; }

  .product-price { font-size: 15px; color: #b22222; font-weight: 600; }

  .product-desc {
    font-size: 13px;
    color: #777;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .product-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }

  .btn-edit {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 7px 12px;
    font-size: 13px;
    font-weight: 500;
    border-radius: 7px;
    text-decoration: none;
    background: #f0f0f0;
    color: #333;
    border: 1px solid #ddd;
    transition: background 0.15s;
  }
  .btn-edit:hover { background: #e5e5e5; }

  .btn-delete {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 7px 12px;
    font-size: 13px;
    font-weight: 500;
    border-radius: 7px;
    text-decoration: none;
    background: #fff0f0;
    color: #b22222;
    border: 1px solid #f5c6c6;
    transition: background 0.15s;
  }
  .btn-delete:hover { background: #ffe0e0; }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: #aaa;
    font-size: 15px;
  }
</style>

<div class="page-wrap">

  <div class="top-bar">
    <h1>產品列表</h1>
    <div class="top-actions">
      <a class="btn btn-ghost" href="{{ url_for('admin_logout') }}">
        <i class="fa-solid fa-right-from-bracket"></i> 登出
      </a>
      <a class="btn btn-primary" href="{{ url_for('add_product') }}">
        <i class="fa-solid fa-plus"></i> 新增產品
      </a>
    </div>
  </div>

  {% if products %}
  <div class="product-list">
    {% for product in products %}
    <div class="product-card">

      <img src="{{ product.image }}" alt="{{ product.name }}">

      <div class="product-info">
        <div class="product-name">{{ product.name }}</div>
        <div class="product-price">NT$ {{ product.price }}</div>
        <div class="product-desc">{{ product.description }}</div>
      </div>

      <div class="product-actions">
        <a class="btn-edit" href="{{ url_for('edit_product', id=product.id) }}">
          <i class="fa-solid fa-pen-to-square"></i> 修改
        </a>
        <a class="btn-delete"
           href="{{ url_for('delete_product', id=product.id) }}"
           onclick="return confirm('確定要刪除「{{ product.name }}」嗎？')">
          <i class="fa-solid fa-trash"></i> 刪除
        </a>
      </div>

    </div>
    {% endfor %}
  </div>

  {% else %}
  <div class="empty">
    <i class="fa-solid fa-box-open" style="font-size:32px; margin-bottom:12px; display:block;"></i>
    目前沒有產品，點擊右上角新增吧
  </div>
  {% endif %}

</div>
