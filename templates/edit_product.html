<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f5f5;
    color: #1a1a1a;
  }

  .page-wrap {
    max-width: 640px;
    margin: 40px auto;
    padding: 0 20px 60px;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    color: #555;
    text-decoration: none;
    margin-bottom: 28px;
  }
  .back-link:hover { color: #1a1a1a; }

  h1 {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 28px;
  }

  .form-card {
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    padding: 28px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .field { display: flex; flex-direction: column; gap: 6px; }

  label {
    font-size: 13px;
    font-weight: 500;
    color: #555;
  }

  input[type="text"],
  input[type="number"],
  textarea {
    width: 100%;
    padding: 10px 12px;
    font-size: 15px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #fafafa;
    outline: none;
    transition: border-color 0.15s;
    font-family: inherit;
  }
  input[type="text"]:focus,
  input[type="number"]:focus,
  textarea:focus { border-color: #999; background: #fff; }

  textarea {
    min-height: 160px;
    resize: vertical;
    line-height: 1.6;
  }

  .product-image {
    width: 100%;
    max-height: 240px;
    object-fit: contain;
    border-radius: 8px;
    border: 1px solid #e5e5e5;
  }

  .image-label {
    font-size: 13px;
    font-weight: 500;
    color: #555;
    margin-bottom: 6px;
  }

  .image-note {
    font-size: 12px;
    color: #999;
    margin-top: 4px;
  }

  .divider {
    border: none;
    border-top: 1px solid #eee;
    margin: 0;
  }

  .btn-submit {
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: #1a1a1a;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-submit:hover { background: #333; }
</style>

<div class="page-wrap">

  <a class="back-link" href="{{ url_for('admin_products') }}">
    <i class="fa-solid fa-arrow-left"></i> 返回商品管理
  </a>

  <h1>修改商品</h1>

  <form method="POST" class="form-card">

    {% if product.image %}
    <div class="field">
      <div class="image-label">商品圖片</div>
      <img class="product-image" src="{{ product.image }}" alt="{{ product.name }}">
      <div class="image-note">圖片不可修改</div>
    </div>
    <hr class="divider">
    {% endif %}

    <div class="field">
      <label>商品名稱</label>
      <input type="text" name="name" value="{{ product.name }}">
    </div>

    <div class="field">
      <label>價格（NT$）</label>
      <input type="number" name="price" value="{{ product.price }}">
    </div>

    <div class="field">
      <label>商品介紹</label>
      <textarea name="description">{{ product.description }}</textarea>
    </div>

    <button type="submit" class="btn-submit">更新商品</button>

  </form>
</div>
